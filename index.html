<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datapulse360</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        background-color: #1f232d;
      }
      header {
        background-color: #1f232d;
        color: white;
        padding: 20px 0;
        position: relative;
        text-align: center;
      }

      header img {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        height: 50px;
        width: auto;
      }

      header h1 {
        margin: 0;
      }
      main {
        padding: 20px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: 1px solid #976d03;
        border-radius: 12px;
        background-color: #121d3a;
        color: white;
        margin-left: 5px;
        margin-right: 5px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        transition: all 0.2s ease;
        width: 225px;
      } button:hover {
        background-color: #0e162c;
        transform: translateY(-1px);
      } button:active {
        transform: translateZ(2px);
      }
      #buttonSection {
        height: 60px;
        width: 100%;
        background-color: #1f232d;
        border: 2px solid #976d03;
        border-radius: 5px;
        display:flex;
        
        align-items: center;
        justify-content:space-evenly;
      }
    </style>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <img
        src="images/logo.png"
        alt="Merrimack College Logo"
        style="height: 50px; margin-left: 10px"
      />
      <h1>DataPulse 360 Merrimack</h1>
    </header>
    <div id="buttonSection">
      <button id="signUp">Sign Up</button>
      <button id="signIn">Sign In</button>
      <button id="SurveysBtn">View Surveys</button>
      <button id="InvitesBtn">My Invites</button>
      <button id="PersonalResults">Personal Results</button>
      <button id="home">Home</button>
    </div>

    <main>
      
      
      <p id="output"></p>
    </main>

    <script src="script.js"></script>
    <script>
      const msalConfig = {
        auth: {
          clientId: "75b59301-f0a4-46da-85c9-d65ceb765775",
          authority:
            "https://login.microsoftonline.com/57e1236c-0fa3-4739-9edf-fd0721c8744d",
          redirectUri: window.location.origin,
        },
      };
      const msalInstance = new msal.PublicClientApplication(msalConfig);

      document.getElementById("signIn").addEventListener("click", async () => {
        try {
          const result = await msalInstance.loginPopup({
            scopes: ["openid", "profile", "User.Read"],
          });
          document.getElementById("output").textContent =
            "Welcome, " +
            result.account.name +
            " (" +
            result.account.username +
            ")";
        } catch (err) {
          document.getElementById("output").textContent =
            "Error: " + err.message;
        }
      });
    </script>
  </body>
</html>
