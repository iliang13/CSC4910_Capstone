<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merrimack 360 Evaluation</title>
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
    .center-text {
      text-align: center;
      color: pink;
    }
  </style>
</head>
<body>
    <header>
        <h1 class = "center-text">Merrimack 360 Self Evaluation Website</h1>
    </header>

    <main>
        <p class = "center-text">Welcome to Merrimack 360 Evaluation</p>
        <button class = "center-text" id="signIn">Sign In With Merrimack</button>
        <p class = "center-text" id="output"></p>
    </main>

    <script src="script.js"></script>
    <script>
        const msalConfig = {
            auth: {
                clientId: "75b59301-f0a4-46da-85c9-d65ceb765775",
                authority: "https://login.microsoftonline.com/57e1236c-0fa3-4739-9edf-fd0721c8744d",
                redirectUri: window.location.origin
            }
        };
        const msalInstance = new msal.PublicClientApplication(msalConfig);

        document.getElementById("signIn").addEventListener("click", async () => {
            try {
                const result = await msalInstance.loginPopup({
                    scopes: ["openid", "profile", "User.Read"]
                });
                document.getElementById("output").textContent =
                    "Welcome, " + result.account.name + " (" + result.account.username + ")";
            } catch (err) {
                document.getElementById("output").textContent = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
