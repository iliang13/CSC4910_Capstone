<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataPulse360 Merrimack</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      :root {
        --color-background: #1f232d; /*1f232d*/
        --color-accent: #976d03;
        --color-button-bg: #121d3a;
        --color-button-hover: #0e162c;
        --color-highlight: #ffd166;
        --color-focus: #d39805;
        --color-builder-bg: #e9d476;
        --color-scrollbar-hover: #c79512;
        --color-delete-bg: #f7120a;
        --color-delete-hover: #bd0d07;
        --color-survey-field: #D5E0A3;
        --color-question-bg: #D6BE7D;
}
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: var(--color-background);
      }

      header {
        background-color: var(--color-background);
        padding: 20px;
        position: relative;
        border-bottom: 2px solid var(--color-accent);
      }

      header img {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        height: 50px;
      }

      header h1 {
        text-align: center;
        margin: 0;
        color: white;
      }

      #buttonSection {
        display: flex;
        justify-content: space-evenly;
        flex-wrap: wrap;
        gap: 10px;
        padding: 15px;
        border-bottom: 2px solid var(--color-accent);
      }

      button {
        width: 190px;
        padding: 10px;
        border: 1px solid var(--color-accent);
        border-radius: 10px;
        background-color: var(--color-button-bg);
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
      }
      button[hidden] {
        display: none;
      }
      button:hover {
        background-color: var(--color-button-hover);
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(1px);
      }
      .deleteSurveyButton {
        padding:0;
        width:20px;
        height:20px;
        border: 1px solid var(--color-accent)00;
        border-radius: 50%;
        background-color: var(--color-delete-bg);
        color: white;
        font-size: 10px;
        cursor: pointer;
        transition: 0.2s; 
      } 
      .deleteSurveyButton:hover {
        background-color: var(--color-delete-hover);
        transform: translateY(-1px);
      }
      .deleteSurveyButton:active {
        transform: translateY(1px);
      }


      main {
        padding: 25px;
      }

      #welcomeMessage {
        background-color: var(--color-button-bg);
        border: 2px solid var(--color-accent);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 25px;
        text-align: center;
      }

      #dashboard {
        display: flex;
        justify-content: center;
        gap: 25px;
        flex-wrap: wrap;
        margin-bottom: 25px;
      }

      .card {
        width: 230px;
        background-color: var(--color-button-bg);
        border: 2px solid var(--color-accent);
        border-radius: 10px;
        padding: 20px;
        text-align: center;
      }

      .card h3 {
        margin-top: 0;
      }

      .stat {
        font-size: 42px;
        color: var(--color-highlight);
        margin: 15px 0;
      }

      #userPanel,
      #activityFeed {
        width: 85%;
        margin: 20px auto;
        background-color: var(--color-button-bg);
        border: 2px solid var(--color-accent);
        border-radius: 10px;
        padding: 20px;
      }

      #activityFeed ul {
        text-align: left;
        line-height: 2;
      }

      #surveySearch {
        width: 350px;
        max-width: 90%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--color-accent);
        margin-bottom: 25px;
      }

      #output {
        text-align: center;
        color: var(--color-highlight);
        font-size: 18px;
        margin-top: 20px;
      }
      #mainPageContainer {
        flex: 1;
        display: flex;
      } 
      .my-div {
        display:none;
        padding:20px;
        background-color: var(--color-background);
        flex: 1;
        color: white;
      }
      .my-div.active {
        display: block;
      }
      .surveysDisplayDiv {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        background-color: none;
        width:100%;
      }
      .surveyField {
        width:100%;
        box-sizing: border-box;

        display: flex;
        justify-content: space-evenly;
        align-items: center;

        padding: 20px;
        border: 1px solid var(--color-accent);
        border-radius: 10px;
        color:var(--color-background);
        background-color:rgb(213, 224, 163);
      }
      .question {
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap:20px;
        justify-content: center;
        color: var(--color-background);
        border: 1px solid var(--color-accent);
        border-radius: 10px;
        padding: 20px;
        background-color:rgb(214, 190, 125);
      }
      .horizontalDiv {
        display: flex;
        flex-direction: row;
        gap: 20px;
        align-items: center;
      }
      .questionInput {
        width: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap:20px;
        justify-content: center;
        color: var(--color-background);
        border: 1px solid var(--color-accent);
        border-radius: 10px;
        padding: 20px;
        background-color:rgb(214, 190, 125);
        resize: none;
      } .questionInput::placeholder {
        color: var(--color-background);
        opacity: 0.7;
      } .questionInput:focus {
        outline: 2px solid var(--color-focus);
        border: 1px solid transparent;
      } .questionInput::-webkit-scrollbar {
        width: 8px;
      }
      .questionInput::-webkit-scrollbar-track {
        background: var(--color-builder-bg);
        border-radius: 10px;
      }
      .questionInput::-webkit-scrollbar-thumb {
        background: var(--color-accent);
        border-radius: 10px;
        border: 2px solid var(--color-builder-bg);
      } 
      .questionInput::-webkit-scrollbar-thumb:hover {
        background: var(--color-scrollbar-hover);
      }

      .surveyBuilder {
        display:none;
        padding: 20px;
        background-color: var(--color-builder-bg);
        border: 2px solid var(--color-accent);
        border-radius: 10px;
        color:var(--color-background);
        overflow-y: auto;
        max-height: 600px;
        gap: 100px;
      } 
      .surveyBuilder.active {
        display:block;
      } 
      .surveyBuilder::-webkit-scrollbar {
        width: 8px;
      }
      .surveyBuilder::-webkit-scrollbar-track {
        background: var(--color-builder-bg);
        border-radius: 10px;
      }
      .surveyBuilder::-webkit-scrollbar-thumb {
        background: var(--color-accent);
        border-radius: 10px;
        border: 2px solid var(--color-builder-bg);
      } 
      .surveyBuilder::-webkit-scrollbar-thumb:hover {
        background: var(--color-scrollbar-hover);
      } #questionsContainer {
        display:flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }

      #authDialog {
        box-sizing: border-box;
        width: min(420px, calc(100% - 48px));
        border: 1px solid var(--color-accent);
        border-radius: 8px;
        background: var(--color-button-bg);
        color: white;
        padding: 24px;
      }
      #authDialog::backdrop {
        background: rgb(0 0 0 / 65%);
      }
      #authForm {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #authForm input {
        box-sizing: border-box;
        width: 100%;
        padding: 11px;
        border: 1px solid var(--color-accent);
        border-radius: 4px;
      }
      #authActions {
        display: flex;
        gap: 10px;
      }
      #authActions button {
        flex: 1;
        width: auto;
      }
      #authMessage {
        min-height: 1.4em;
        color: var(--color-highlight);
      }
      .submitContainer {
        display: flex;
        justify-content: center;
        margin-top: 30px 0;
      }
    </style>
  </head>

  <body>
    <header>
      <img src="../images/logo.png"/>
      <h1>DataPulse360 Merrimack</h1>
    </header>

    <div id="buttonSection">
      <button id="signIn">Sign In</button>
      <button id="signOut" type="button" hidden>Sign Out</button>
    </div>

    <div id="mainPageContainer">

        <div id="homeDiv" class="my-div active">
          
          <div id="welcomeMessage">
            <h2>Welcome to DataPulse360</h2>
            <p>
                DataPulse360 is designed to streamline survey participation, student
                feedback collection, and engagement analytics across Merrimack
                College.
            </p>
          </div>
  
      
        </div>
    </div>
    </div>

    <main>
      <p id="output"></p>
    </main>

    <dialog id="authDialog">
      <form id="authForm">
        <h2 id="authTitle">Sign In</h2>
        
        <button id="googleAuthButton" type="button">Continue with Google</button>
        <p>Sign in with Google. First time users will automatically have an account created.</p>
        
        <p id="authMessage" role="status"></p>
          <button id="closeAuthDialog" type="button">Cancel</button>
      </form>
    </dialog>

    <script>

      const signInButton = document.getElementById("signIn");
      const signOutButton = document.getElementById("signOut");

      // Universal Authentication2 Setup
      const authDialog = document.getElementById("authDialog");
      const authForm = document.getElementById("authForm");

      const authTitle = document.getElementById("authTitle");

      const googleAuthButton = document.getElementById("googleAuthButton");
      const authMessage = document.getElementById("authMessage");
      const authStorageKey = "datapulse360-auth";
      let supabaseClient;
      let authSetupState = "loading";

      googleAuthButton.disabled = true;

      function openAuthDialog() {
        authForm.reset();
        authTitle.textContent = "Sign In";
        googleAuthButton.textContent = "Sign in with Google";
        authMessage.textContent = authSetupState === "ready"
          ? ""
          : authSetupState === "loading"
            ? "Loading secure sign-in..."
            : "Sign-in setup could not load. Refresh the page and try again.";
        authDialog.showModal();
      }

      signInButton.addEventListener("click", () => openAuthDialog());
      document.getElementById("closeAuthDialog").addEventListener("click", () => authDialog.close());

      async function signOutCurrentSession() {
        const { error } = await supabaseClient.auth.signOut({ scope: "global" });
        if (error) throw error;

        await fetch("/api/admin-session/logout", {
          method: "POST",
        });

        const userStatus = document.getElementById("userStatus");
        if (userStatus) {
          userStatus.textContent = "Not Signed In";
        }
      }

      googleAuthButton.addEventListener("click", async () => {
        if (!supabaseClient) {
          authMessage.textContent = "Sign-in setup could not load. Refresh the page and try again.";
          return;
        }

        googleAuthButton.disabled = true;
        authMessage.textContent = "";
        try {
          const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: `${window.location.origin}${window.location.pathname}`,
              queryParams: { prompt: "select_account" },
            },
          });
          if (error) throw error;
        } catch (err) {
          authMessage.textContent = err.message || "Google sign-in failed.";
          googleAuthButton.disabled = false;
        }
      });

      async function showAuthenticatedUser(session) {
        const userStatus = document.getElementById("userStatus");
        const welcomeMessage = document.getElementById("welcomeMessage");
        const output = document.getElementById("output");

        if (!session) {
          if (userStatus) {
            userStatus.textContent = "Not Signed In";
          }
          return;
        }

        try {
          const response = await fetch("/api/me", {
            headers: { Authorization: `Bearer ${session.access_token}` },
          });

          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Could not verify account.");
          }

          const adminResponse = await fetch("/api/admin-session", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${session.access_token}`,
            },
          });

          if (!adminResponse.ok && adminResponse.status !== 403) {
            throw new Error("Could not establish administrator session. Please sign in as an administrator.");
          }

          if (adminResponse.ok) {
            window.location.href = "/admin/home";
            return;
          } else if (adminResponse.status === 403) {
            if (window.location.pathname !== "/user/home") {
              window.location.href = "/user/home";
            }
            return;
          }

          if (userStatus) {
            userStatus.textContent = `Signed in as ${payload.user.email}`;
          }

          if (welcomeMessage) {
            welcomeMessage.querySelector("h2").textContent =
              `Welcome Back, ${payload.user.email}`;
          }

          if (output) {
            output.textContent = "Successfully signed in.";
          }
        } catch (err) {
          if (userStatus) {
            userStatus.textContent = "Not Signed In";
          }

          if (output) {
            output.textContent = err.message;
          }
        }
      }

      fetch("/api/config")
        .then(async (response) => {
          const config = await response.json();
          if (!response.ok) throw new Error(config.error || "Authentication setup is unavailable.");
          if (!window.supabase?.createClient) {
            throw new Error("The sign-in library did not load.");
          }
          if (typeof config.supabaseUrl !== "string" || typeof config.supabaseAnonKey !== "string") {
            throw new Error("The server returned incomplete sign-in configuration.");
          }
          supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
            auth: {
              storage: window.sessionStorage,
              storageKey: authStorageKey,
            },
          });

          supabaseClient.auth.onAuthStateChange((event, session) => {
            if (event === "TOKEN_REFRESHED" && session) {
              fetch("/api/admin-session", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${session.access_token}`,
                },
              }).then(async (response) => {
                if (!response.ok && response.status !== 403) {
                  console.error("Failed to refresh admin session.");
                }
              }).catch((error) => {
                console.error("Admin session refresh failed:", error);
              });
            }
          });
          const { data } = await supabaseClient.auth.getSession();
          
          authSetupState = "ready";
          googleAuthButton.disabled = false;

          await showAuthenticatedUser(data.session);
        })
        .catch((err) => {
          authSetupState = "error";
          googleAuthButton.disabled = true;
          console.error("Could not initialize sign-in:", err);
          authMessage.textContent = "Sign-in setup could not load. Refresh the page and try again.";
          document.getElementById("output").textContent = err.message;
        });


    </script>
  </body>
</html>
