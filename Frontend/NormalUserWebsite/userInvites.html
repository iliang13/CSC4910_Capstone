
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPulse360 - Results</title>
    <link rel="stylesheet" href="../Styling.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <img src="../images/logo.png" alt="DataPulse360 Logo">
        <h1>DataPulse360 Merrimack</h1>
    </header>

    <div id="buttonSection">
        <button id="home">Home</button>
        <button id="SurveysBtn">View Surveys</button>
        <button id="InvitesBtn">Invitee Status</button>
        <button id="PersonalResults">Personal Results</button>
        <button id="signUp">Sign Up</button>
        <button id="signIn">Sign In</button>
    </div>

    <main>
        
    </main>

    <main>
        <p id="output"></p>
    </main>

    <dialog id="authDialog">
        <form id="authForm">
            <h2 id="authTitle">Sign In</h2>
            <button id="googleAuthButton" type="button">Continue with Google</button>
            <p>Google sign-in creates your account the first time you use it.</p>
            <label for="authEmail">Email</label>
            <input id="authEmail" type="email" autocomplete="email" required />
            <label for="authPassword">Password</label>
            <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required />
            <p id="authMessage" role="status"></p>
            <div id="authActions">
                <button id="closeAuthDialog" type="button">Cancel</button>
                <button id="authSubmit" type="submit">Sign In</button>
            </div>
        </form>
    </dialog>

    <script src="../classes.js"></script>
    <script src="/NormalUserWebsite/userSurveys.js"></script>
    <script src="/NormalUserWebsite/userNavigation.js"></script>

</body>
</html>
