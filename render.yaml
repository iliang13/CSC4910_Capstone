services:
  - type: web
    name: datapulse360
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci --prefix Backend
    startCommand: npm start --prefix Backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
